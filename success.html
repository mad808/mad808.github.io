<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You! | Abdyleziz</title>
  
  <!-- CDN Dependencies -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #1e1e1e;
      --accent: #00e5a0;
      --text: #e8e8e8;
      --muted: #888888;
      --sans: 'Poppins', sans-serif;
      --mono: 'Space Mono', monospace;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      margin: 0;
      padding: 1.5rem;
    }

    /* Noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 10;
      opacity: 0.35;
    }

    .success-card {
      max-width: 500px;
      width: 100%;
      padding: 3rem 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
      position: relative;
      z-index: 20;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    /* Custom checkmark stroke animation */
    .checkmark-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
    }
    .checkmark {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      stroke-width: 2;
      stroke: var(--accent);
      stroke-miterlimit: 10;
      display: block;
    }
    .checkmark__circle {
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      stroke-width: 2;
      stroke-miterlimit: 10;
      stroke: var(--accent);
      fill: none;
      animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }
    .checkmark__check {
      transform-origin: 50% 50%;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
    }

    @keyframes stroke {
      100% { stroke-dashoffset: 0; }
    }

    h1 {
      font-family: var(--mono);
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 2rem;
      background: var(--accent);
      color: #000;
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-decoration: none;
      border: none;
      border-radius: 4px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 229, 160, 0.25);
      color: #000;
    }
  </style>
</head>
<body>

  <div class="success-card">
    <div class="checkmark-wrapper">
      <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
        <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none" />
        <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
      </svg>
    </div>
    
    <h1 data-translate="thankYouTitle">Thank You!</h1>
    <p data-translate="thankYouMessage">Your message has been sent successfully. I will get back to you shortly.</p>
    
    <a href="index.html" class="btn btn-primary" data-translate="returnButton">Return to Portfolio →</a>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const translations = {
        en: {
          thankYouTitle: "Thank You!",
          thankYouMessage: "Your message has been sent successfully. I will get back to you shortly.",
          returnButton: "Return to Portfolio →"
        },
        ru: {
          thankYouTitle: "Спасибо!",
          thankYouMessage: "Ваше сообщение успешно отправлено. Я свяжусь с вами в ближайшее время.",
          returnButton: "Вернуться к портфолио →"
        },
        tk: {
          thankYouTitle: "Sag boluň!",
          thankYouMessage: "Siziň hatyňyz üstünlikli ugradyldy. Men size tiz wagtda jogap bererin.",
          returnButton: "Portfolio dolanmak →"
        }
      };

      const savedLang = localStorage.getItem('language') || 'en';

      document.querySelectorAll('[data-translate]').forEach(el => {
        const key = el.getAttribute('data-translate');
        if (translations[savedLang] && translations[savedLang][key]) {
          el.innerHTML = translations[savedLang][key];
        }
      });
    });
  </script>
</body>
</html>
